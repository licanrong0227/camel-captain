<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>采集设置弹窗</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    html, body {
      box-sizing: border-box;
      width: 100%;
      margin: 0;
      padding: 0;
      min-height: 100%;
      height: 100%;
      overflow-x: hidden;
      overflow-y: auto;
    }
    #root {
      width: 100%;
      margin-left: auto;
      margin-right: auto;
      height: 100%;
      min-height: 100vh;
      overflow: visible;
    }
    body.is-element-page #root {
      width: 100vw;
      height: 100vh;
    }
  </style>
  <style>
:root{--cs-primary: #ff781f;--cs-text: #1d2129;--cs-text-regular: #4e5969;--cs-text-secondary: #86909c;--cs-border: #dcdfe6;--cs-font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", Helvetica, Arial, sans-serif}.cs-layer{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;background:#00000073;font-family:var(--cs-font);color:var(--cs-text);font-variant-numeric:tabular-nums}.cs-layer *,.cs-layer *:before,.cs-layer *:after{box-sizing:border-box}.cs-layer button{margin:0;font-family:inherit;cursor:pointer}.cs-dialog{position:relative;width:560px;border-radius:4px;background:#fff;box-shadow:0 2px 12px #0000001f}.cs-head{display:flex;align-items:center;justify-content:space-between;height:62px;padding:0 26px 0 28px}.cs-title{margin:0;font-size:18px;font-weight:500;line-height:24px;color:var(--cs-text)}.cs-close{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;padding:0;border:0;background:transparent;color:#909399}.cs-close svg{width:16px;height:16px}.cs-close:hover{color:#606266}.cs-body{padding:30px 28px 8px}.cs-row{display:flex;align-items:flex-start}.cs-row+.cs-row{margin-top:18px}.cs-row-label{display:flex;flex:0 0 190px;align-items:flex-start;margin-right:24px;font-size:14px;line-height:22px;color:#303133}.cs-label-text{display:inline-block}.cs-help-wrap{position:relative;display:inline-flex;margin-left:4px;padding-top:2px}.cs-help{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;padding:0;border:1px solid #c0c4cc;border-radius:50%;background:#fff;font-size:11px;line-height:1;color:#909399}.cs-help:hover,.cs-help-wrap:focus-within .cs-help{border-color:var(--cs-primary);color:var(--cs-primary)}.cs-tip{position:absolute;bottom:26px;left:-48px;z-index:20;display:none;width:max-content;max-width:420px;padding:6px 9px;border:1px solid #303133;background:#fff;box-shadow:0 2px 8px #00000014;font-size:12px;line-height:20px;color:#1d2129;white-space:pre-line}.cs-tip:before{content:"";position:absolute;bottom:-5px;left:48px;width:8px;height:8px;border-right:1px solid #303133;border-bottom:1px solid #303133;background:#fff;transform:rotate(45deg)}.cs-tip.is-bottom{top:26px;bottom:auto}.cs-tip.is-bottom:before{top:-5px;bottom:auto;border-top:1px solid #303133;border-left:1px solid #303133;border-right:0;border-bottom:0}.cs-help-wrap:hover .cs-tip,.cs-help-wrap:focus-within .cs-tip{display:block}.cs-options{display:flex;align-items:center;gap:24px;padding-top:1px}.cs-switch{position:relative;width:40px;height:20px;margin-top:2px;padding:0;border:1px solid #dcdfe6;border-radius:10px;background:#fff;transition:background-color .2s ease,border-color .2s ease}.cs-switch i{position:absolute;top:1px;left:1px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px #0003;transition:left .2s ease}.cs-switch.is-on{border-color:var(--cs-primary);background:var(--cs-primary)}.cs-switch.is-on i{left:21px}.cs-radio{display:inline-flex;align-items:center;gap:8px;font-size:14px;line-height:20px;color:#303133;cursor:pointer}.cs-radio input{position:absolute;width:0;height:0;opacity:0;pointer-events:none}.cs-radio-dot{position:relative;display:inline-block;width:16px;height:16px;border:1px solid var(--cs-border);border-radius:50%;background:#fff;transition:border-color .15s ease}.cs-radio:hover .cs-radio-dot,.cs-radio.is-checked .cs-radio-dot{border-color:var(--cs-primary)}.cs-radio.is-checked .cs-radio-dot:after{content:"";position:absolute;top:50%;left:50%;width:8px;height:8px;border-radius:50%;background:var(--cs-primary);transform:translate(-50%,-50%)}.cs-foot{display:flex;align-items:center;justify-content:flex-end;gap:12px;padding:30px 28px 28px}.cs-btn{min-width:78px;height:36px;padding:0 18px;border:1px solid var(--cs-border);border-radius:4px;background:#fff;font-size:14px;line-height:1;color:#606266}.cs-btn:hover{border-color:#b8bfcc;color:#303133}.cs-btn-primary{min-width:74px;border-color:var(--cs-primary);background:var(--cs-primary);color:#fff}.cs-btn-primary:hover{border-color:#ff9148;background:#ff9148;color:#fff}.cs-reopen{height:36px;padding:0 20px;border:1px solid var(--cs-border);border-radius:4px;background:#fff;box-shadow:0 2px 10px #00000014;font-size:14px;color:#303133}.cs-reopen:hover{border-color:var(--cs-primary);color:var(--cs-primary)}.cs-toast{position:fixed;top:28px;left:50%;z-index:30;padding:9px 16px;border:1px solid #ebeef5;border-radius:4px;background:#fff;box-shadow:0 2px 12px #0015291f;font-size:13px;color:#606266;transform:translate(-50%)}

  </style>
</head>
<body>

  <script>
    (function () {
      var isComponent = false;
      if (document.body && (isComponent || window.location.pathname.includes('/components/'))) {
        document.body.classList.add('is-element-page');
      }
    })();
  </script>

  <div id="root"></div>

  
  <script src="./assets/react.production.min.js"></script>
  <script src="./assets/react-dom.production.min.js"></script>
  <script src="./assets/export-html-bootstrap.js"></script>

  <script>
    function waitForBootstrap(timeoutMs) {
      timeoutMs = timeoutMs || 10000;
      return new Promise(function (resolve, reject) {
        var startedAt = Date.now();
        function check() {
          if (window.HtmlTemplateBootstrap) {
            resolve(window.HtmlTemplateBootstrap);
            return;
          }
          if (Date.now() - startedAt >= timeoutMs) {
            reject(new Error('[Html Template] Bootstrap 初始化超时'));
            return;
          }
          setTimeout(check, 10);
        }
        check();
      });
    }

    function loadEntryScript(src) {
      return new Promise(function (resolve, reject) {
        var script = document.createElement('script');
        script.src = src;
        script.async = false;
        script.onload = function () { resolve(); };
        script.onerror = function () { reject(new Error('[Html Template] 入口脚本加载失败: ' + src)); };
        document.body.appendChild(script);
      });
    }

    async function bootstrapAndRender() {
      try {
        var bootstrap = await waitForBootstrap();
        var renderComponent = bootstrap.renderComponent;
        window.React = bootstrap.React;
        window.ReactDOM = bootstrap.ReactDOM;

        await loadEntryScript('./index.js');
        

        var Component = window.UserComponent && (window.UserComponent.Component || window.UserComponent.default || window.UserComponent);
        if (!Component) {
          throw new Error('[Html Template] 入口脚本未暴露 UserComponent');
        }

        renderComponent(Component);
      } catch (error) {
        console.error('[Html Template] 页面初始化失败:', error);
      }
    }

    bootstrapAndRender();
  </script>

</body>
</html>
