<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>购买会员弹窗 - 骆驼队长BI</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    html, body {
      box-sizing: border-box;
      width: 100%;
      margin: 0;
      padding: 0;
      min-height: 100%;
      height: 100%;
      overflow-x: hidden;
      overflow-y: auto;
    }
    #root {
      width: 100%;
      margin-left: auto;
      margin-right: auto;
      height: 100%;
      min-height: 100vh;
      overflow: visible;
    }
    body.is-element-page #root {
      width: 100vw;
      height: 100vh;
    }
  </style>
  <style>
:root{--mpd-brand: #ff781f;--mpd-brand-hover: #ff9148;--mpd-radio: #1890ff;--mpd-title: #303133;--mpd-text: #606266;--mpd-border: #dcdfe6;--mpd-amount: #d48806;--mpd-font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", Helvetica, Arial, sans-serif}.mpd-page{position:fixed;inset:0;background:#fff;font-family:var(--mpd-font);color:var(--mpd-text);font-size:14px;font-variant-numeric:tabular-nums}.mpd-page *,.mpd-page *:before,.mpd-page *:after{box-sizing:border-box}.mpd-mask{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;background:#00000080;overflow-y:auto}.mpd-dialog{display:flex;flex-direction:column;width:560px;max-width:100%;margin:auto;border-radius:6px;background:#fff;box-shadow:0 1px 3px #0000004d}.mpd-head{position:relative;flex:none;padding:20px 20px 10px}.mpd-title{margin:0;font-size:18px;font-weight:400;line-height:24px;color:var(--mpd-title)}.mpd-close{position:absolute;top:20px;right:20px;display:inline-flex;width:16px;height:16px;align-items:center;justify-content:center;padding:0;border:0;background:none;color:#909399;cursor:pointer}.mpd-close:hover{color:var(--mpd-brand)}.mpd-close svg{width:16px;height:16px}.mpd-body{flex:1;padding:30px 20px}.mpd-body-inner{padding:4px 8px 8px}.mpd-label{margin:0 0 12px;font-size:14px;font-weight:600;line-height:16px;color:var(--mpd-title)}.mpd-period-group{display:flex;flex-wrap:wrap;gap:16px 24px;margin:0 0 24px}.mpd-period-item{position:relative;display:inline-flex;align-items:center;padding-top:4px;font-size:14px;font-weight:500;line-height:16px;color:var(--mpd-text);cursor:pointer}.mpd-period-item.is-checked{color:var(--mpd-radio)}.mpd-radio{position:relative;display:inline-block;width:14px;height:14px;flex:none;border:1px solid var(--mpd-border);border-radius:100%;background:#fff;transition:border-color .2s,background-color .2s}.mpd-radio.is-checked{border-color:var(--mpd-radio);background:var(--mpd-radio)}.mpd-radio.is-checked:after{content:"";position:absolute;left:50%;top:50%;width:4px;height:4px;border-radius:50%;background:#fff;transform:translate(-50%,-50%)}.mpd-period-label{position:relative;display:inline-block;padding-left:10px;color:inherit}.mpd-period-text{font-size:14px}.mpd-tag{position:absolute;top:-10px;right:-18px;padding:2px 4px;border-radius:4px;background:#ff7a45;color:#fff;font-size:10px;font-weight:500;line-height:1;white-space:nowrap}.mpd-amount-row{display:flex;align-items:baseline;margin-bottom:4px}.mpd-amount-original{text-decoration:line-through}.mpd-amount-meta{display:flex;flex-wrap:wrap;align-items:baseline;gap:16px;margin-bottom:8px;font-size:12px;line-height:18px;color:#909399}.mpd-deduct-value{margin-left:4px;color:#f56c6c}.mpd-amount{margin:0;font-size:28px;font-weight:700;line-height:32px;color:var(--mpd-amount)}.mpd-foot{flex:none;padding:10px 20px 20px;text-align:center}.mpd-foot-actions{display:inline-flex;gap:10px}.mpd-btn{min-width:0;height:36px;padding:0 20px;border:1px solid var(--mpd-brand);border-radius:8px;background:#fff;color:var(--mpd-brand);font-family:inherit;font-size:14px;line-height:14px;cursor:pointer;transition:color .2s,border-color .2s,background-color .2s}.mpd-btn:hover{border-color:var(--mpd-brand-hover);color:var(--mpd-brand-hover)}.mpd-btn--primary{background:var(--mpd-brand);color:#fff}.mpd-btn--primary:hover{background:var(--mpd-brand-hover);border-color:var(--mpd-brand-hover);color:#fff}.mpd-btn--primary:disabled{border-color:#ffc29a;background:#ffc29a;cursor:not-allowed}.mpd-reopen{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);height:36px;padding:0 20px;border:1px solid var(--mpd-brand);border-radius:8px;background:#fff;color:var(--mpd-brand);font-family:inherit;font-size:14px;cursor:pointer}.mpd-reopen:hover{background:#fff7f0}.mpd-toast{position:fixed;left:50%;top:40px;z-index:10;transform:translate(-50%);padding:10px 18px;border:1px solid #e1f3d8;border-radius:6px;background:#f0f9eb;color:#67c23a;font-size:14px;box-shadow:0 2px 12px #00000014}

  </style>
</head>
<body>

  <script>
    (function () {
      var isComponent = false;
      if (document.body && (isComponent || window.location.pathname.includes('/components/'))) {
        document.body.classList.add('is-element-page');
      }
    })();
  </script>

  <div id="root"></div>

  
  <script src="./assets/react.production.min.js"></script>
  <script src="./assets/react-dom.production.min.js"></script>
  <script src="./assets/export-html-bootstrap.js"></script>

  <script>
    function waitForBootstrap(timeoutMs) {
      timeoutMs = timeoutMs || 10000;
      return new Promise(function (resolve, reject) {
        var startedAt = Date.now();
        function check() {
          if (window.HtmlTemplateBootstrap) {
            resolve(window.HtmlTemplateBootstrap);
            return;
          }
          if (Date.now() - startedAt >= timeoutMs) {
            reject(new Error('[Html Template] Bootstrap 初始化超时'));
            return;
          }
          setTimeout(check, 10);
        }
        check();
      });
    }

    function loadEntryScript(src) {
      return new Promise(function (resolve, reject) {
        var script = document.createElement('script');
        script.src = src;
        script.async = false;
        script.onload = function () { resolve(); };
        script.onerror = function () { reject(new Error('[Html Template] 入口脚本加载失败: ' + src)); };
        document.body.appendChild(script);
      });
    }

    async function bootstrapAndRender() {
      try {
        var bootstrap = await waitForBootstrap();
        var renderComponent = bootstrap.renderComponent;
        window.React = bootstrap.React;
        window.ReactDOM = bootstrap.ReactDOM;

        await loadEntryScript('./index.js');
        

        var Component = window.UserComponent && (window.UserComponent.Component || window.UserComponent.default || window.UserComponent);
        if (!Component) {
          throw new Error('[Html Template] 入口脚本未暴露 UserComponent');
        }

        renderComponent(Component);
      } catch (error) {
        console.error('[Html Template] 页面初始化失败:', error);
      }
    }

    bootstrapAndRender();
  </script>

</body>
</html>
