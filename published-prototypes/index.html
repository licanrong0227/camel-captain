<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>原型发布地址</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    html, body {
      box-sizing: border-box;
      width: 100%;
      margin: 0;
      padding: 0;
      min-height: 100%;
      height: 100%;
      overflow-x: hidden;
      overflow-y: auto;
    }
    #root {
      width: 100%;
      margin-left: auto;
      margin-right: auto;
      height: 100%;
      min-height: 100vh;
      overflow: visible;
    }
    body.is-element-page #root {
      width: 100vw;
      height: 100vh;
    }
  </style>
  <style>
.pp-page{min-height:100vh;padding:20px;background:#f7f8fa;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Hiragino Sans GB,Microsoft YaHei,Helvetica,Arial,sans-serif;color:#1d2129}.pp-card{max-width:1500px;margin:0 auto;padding:20px;background:#fff;border:1px solid #e5e6eb;border-radius:8px}.pp-card__header{display:flex;align-items:baseline;gap:12px;margin-bottom:16px}.pp-title{margin:0;font-size:18px;line-height:26px;font-weight:500;color:#1d2129}.pp-count{font-size:12px;line-height:20px;color:#86909c}.pp-table{width:100%;border-collapse:collapse;border:1px solid #e5e6eb;font-size:14px}.pp-table th,.pp-table td{padding:8px 16px;text-align:left;vertical-align:top;border-bottom:1px solid #ebeef5}.pp-table thead th{background:#f7f8fa;color:#4e5969;font-size:14px;font-weight:500;line-height:22px}.pp-table tbody tr:last-child td{border-bottom:none}.pp-table tbody tr:hover td{background:#f7f8fa}.pp-table__col-name{width:160px}.pp-table__col-url{width:320px}.pp-table__col-time{width:132px;white-space:nowrap}.pp-table__time{color:#4e5969;line-height:22px;white-space:nowrap;font-variant-numeric:tabular-nums}.pp-table__name{color:#1d2129;line-height:22px}.pp-table__summary ol{margin:0;padding-left:20px;color:#1d2129;font-size:12px;line-height:20px}.pp-table__summary li+li{margin-top:2px}.pp-table__link{color:#ff7d29;line-height:22px;text-decoration:none;word-break:break-all;font-variant-numeric:tabular-nums}.pp-table__link:hover{color:#ff9148}.pp-table__link:active{color:#d25909}

  </style>
</head>
<body>

  <script>
    (function () {
      var isComponent = false;
      if (document.body && (isComponent || window.location.pathname.includes('/components/'))) {
        document.body.classList.add('is-element-page');
      }
    })();
  </script>

  <div id="root"></div>

  
  <script src="./assets/react.production.min.js"></script>
  <script src="./assets/react-dom.production.min.js"></script>
  <script src="./assets/export-html-bootstrap.js"></script>

  <script>
    function waitForBootstrap(timeoutMs) {
      timeoutMs = timeoutMs || 10000;
      return new Promise(function (resolve, reject) {
        var startedAt = Date.now();
        function check() {
          if (window.HtmlTemplateBootstrap) {
            resolve(window.HtmlTemplateBootstrap);
            return;
          }
          if (Date.now() - startedAt >= timeoutMs) {
            reject(new Error('[Html Template] Bootstrap 初始化超时'));
            return;
          }
          setTimeout(check, 10);
        }
        check();
      });
    }

    function loadEntryScript(src) {
      return new Promise(function (resolve, reject) {
        var script = document.createElement('script');
        script.src = src;
        script.async = false;
        script.onload = function () { resolve(); };
        script.onerror = function () { reject(new Error('[Html Template] 入口脚本加载失败: ' + src)); };
        document.body.appendChild(script);
      });
    }

    async function bootstrapAndRender() {
      try {
        var bootstrap = await waitForBootstrap();
        var renderComponent = bootstrap.renderComponent;
        window.React = bootstrap.React;
        window.ReactDOM = bootstrap.ReactDOM;

        await loadEntryScript('./index.js');
        

        var Component = window.UserComponent && (window.UserComponent.Component || window.UserComponent.default || window.UserComponent);
        if (!Component) {
          throw new Error('[Html Template] 入口脚本未暴露 UserComponent');
        }

        renderComponent(Component);
      } catch (error) {
        console.error('[Html Template] 页面初始化失败:', error);
      }
    }

    bootstrapAndRender();
  </script>

</body>
</html>
