<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' data:; style-src 'unsafe-inline'; font-src 'self' data:"><meta name="viewport" content="width=device-width,initial-scale=1"><title>截图还原首版视觉稿</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#eef1f5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}button{margin:0;padding:0;border:0;font:inherit}.reconstruction-stage{position:relative;overflow:hidden;width:733px;height:345px;background:#fff}img{display:block}
</style></head><body><main class="reconstruction-stage" data-renderer="reconstruction-review-v1" data-model-calls-during-render="0">
<div data-reconstruction-id="backdrop" data-asset-action="none" style="position:absolute;left:0px;top:0px;width:733px;height:345px;background-color:#7f7f7f"></div>
<div data-reconstruction-id="dialog" data-asset-action="none" style="position:absolute;left:8px;top:6px;width:720px;height:334px;background-color:#ffffff;border:1px solid #e1e1e2;border-radius:4px"></div>
<div data-reconstruction-id="title" data-asset-action="none" style="position:absolute;left:28px;top:25px;width:100px;height:24px;color:#303133;font-size:18px;font-weight:400;line-height:24px" data-text-role="ui-text" data-render-mode="html-text">更新发布</div>
<div data-reconstruction-id="close" data-asset-action="none" style="position:absolute;left:692px;top:27px;width:16px;height:16px;color:#909399;font-size:14px;line-height:16px;text-align:center" data-text-role="ui-text" data-render-mode="html-text">×</div>
<div data-reconstruction-id="checkbox-auto-list" data-asset-action="none" style="position:absolute;left:28px;top:112px;width:14px;height:14px;background-color:#1890ff;border-radius:2px"></div>
<div data-reconstruction-id="checkbox-auto-list-check" data-asset-action="none" style="position:absolute;left:28px;top:112px;width:14px;height:14px;color:#ffffff;font-size:12px;line-height:14px;text-align:center" data-text-role="ui-text" data-render-mode="html-text">✓</div>
<div data-reconstruction-id="label-auto-list" data-asset-action="none" style="position:absolute;left:53px;top:110px;width:64px;height:18px;color:#1890ff;font-size:14px;line-height:18px" data-text-role="ui-text" data-render-mode="html-text">自动刊登</div>
<div data-reconstruction-id="radio-now" data-asset-action="none" style="position:absolute;left:53px;top:139px;width:14px;height:14px;background-color:#1890ff;border-radius:50%"></div>
<div data-reconstruction-id="radio-now-dot" data-asset-action="none" style="position:absolute;left:58px;top:144px;width:4px;height:4px;background-color:#ffffff;border-radius:50%"></div>
<div data-reconstruction-id="label-now" data-asset-action="none" style="position:absolute;left:77px;top:137px;width:64px;height:18px;color:#1890ff;font-size:14px;line-height:18px" data-text-role="ui-text" data-render-mode="html-text">立即发布</div>

<div data-reconstruction-id="label-scheduled" data-asset-action="none" style="position:absolute;left:187px;top:137px;width:64px;height:18px;color:#606266;font-size:14px;line-height:18px" data-text-role="ui-text" data-render-mode="html-text">定时发布</div>
<button data-reconstruction-id="btn-cancel" data-asset-action="none" style="position:absolute;left:137px;top:270px;width:70px;height:36px;align-items:center;background-color:#ffffff;border:1px solid #ff781f;border-radius:4px;color:#ff781f;display:flex;font-size:14px;justify-content:center;padding-bottom:2px" data-text-role="ui-text" data-render-mode="html-text">取消</button>
<button data-reconstruction-id="btn-confirm" data-asset-action="none" style="position:absolute;left:217px;top:270px;width:71px;height:36px;align-items:center;background-color:#ff781f;border-radius:4px;color:#ffffff;display:flex;font-size:14px;justify-content:center;padding-bottom:2px" data-text-role="ui-text" data-render-mode="html-text">确定</button>
<div data-reconstruction-id="checkbox-fail-relist" data-asset-action="none" style="position:absolute;left:295px;top:281px;width:14px;height:14px;background-color:#ffffff;border:1px solid #1890ff;border-radius:2px"></div>
<div data-reconstruction-id="label-fail-relist" data-asset-action="none" style="position:absolute;left:319px;top:279px;width:92px;height:18px;color:#606266;font-size:14px;line-height:18px" data-text-role="ui-text" data-render-mode="html-text">失败自动刊登</div>
<div data-reconstruction-id="label-loop-count" data-asset-action="none" style="position:absolute;left:413px;top:279px;width:64px;height:18px;color:#606266;font-size:14px;line-height:18px" data-text-role="ui-text" data-render-mode="html-text">循环次数</div>

<div data-reconstruction-id="input-loop-divider" data-asset-action="none" style="position:absolute;left:565px;top:274px;width:1px;height:28px;background-color:#dfe4ed"></div>
<div data-reconstruction-id="input-loop-arrow-up" data-asset-action="none" style="position:absolute;left:566px;top:274px;width:27px;height:14px;color:#c0c4cc;font-size:10px;line-height:14px;text-align:center" data-text-role="ui-text" data-render-mode="html-text">∧</div>
<div data-reconstruction-id="input-loop-arrow-down" data-asset-action="none" style="position:absolute;left:566px;top:288px;width:27px;height:14px;color:#c0c4cc;font-size:10px;line-height:14px;text-align:center" data-text-role="ui-text" data-render-mode="html-text">∨</div>
</main></body></html>
