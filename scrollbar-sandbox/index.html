-custom-on .sbd-v-webkit::-webkit-scrollbar-corner{background:#f1f3f7}.sbd-custom-on .sbd-v-standard{scrollbar-width:thin;scrollbar-color:#ff7d29 #eef0f4}.sbd-custom-on .sbd-v-thin{scrollbar-width:thin}.sbd-custom-on .sbd-v-mixed{scrollbar-width:thin;scrollbar-color:#ff7d29 #ffe8d8}.sbd-custom-on .sbd-v-mixed::-webkit-scrollbar{width:18px;height:18px}.sbd-custom-on .sbd-v-mixed::-webkit-scrollbar-thumb{background:#2c7bfc;border-radius:0}.sbd-custom-on .sbd-v-mixed::-webkit-scrollbar-track{background:#dbe6ff}.sbd-custom-on .sbd-v-mixed::-webkit-scrollbar-corner{background:#dbe6ff}.sbd-custom-on .sbd-v-element::-webkit-scrollbar{width:6px;height:6px}.sbd-custom-on .sbd-v-element::-webkit-scrollbar-thumb{background:#c0c4cc;border-radius:999px}.sbd-custom-on .sbd-v-element::-webkit-scrollbar-thumb:hover{background:#909399}.sbd-custom-on .sbd-v-element::-webkit-scrollbar-track{background:transparent}.sbd-custom-on .sbd-v-element::-webkit-scrollbar-corner{background:transparent}.sbd-custom-on .sbd-v-overlay{scrollbar-width:none}.sbd-custom-on .sbd-v-overlay::-webkit-scrollbar{display:none;width:0;height:0}.sbd-ov-layer{position:absolute;inset:0;z-index:5;pointer-events:none}.sbd-ov-track{position:absolute;border-radius:999px;pointer-events:auto}.sbd-ov-track-v{top:4px;right:3px;width:8px}.sbd-ov-track-h{left:4px;bottom:3px;height:8px}.sbd-ov-track:hover{background:#ff7d2914}.sbd-ov-thumb{position:absolute;border-radius:999px;background:#ff7d298c;cursor:pointer;touch-action:none}.sbd-ov-thumb:hover,.sbd-ov-thumb:active{background:#ff7d29}.sbd-ov-thumb-v{top:0;left:1px;width:6px}.sbd-ov-thumb-h{left:0;top:1px;height:6px}.sbd-page:not(.sbd-custom-on) .sbd-ov-layer{display:none}.sbd-notes{padding:16px 18px;border:1px solid #e6e8ee;border-radius:12px;background:#fff;box-shadow:0 2px 10px #181e280a;color:#5b6270;font-size:12px}.sbd-notes h2{margin-bottom:8px;color:#23262d}.sbd-notes h3{margin:14px 0 6px;color:#23262d;font-size:13px;font-weight:600}.sbd-notes ol,.sbd-notes ul{pa <body>

  <script>
    (function () {
      var isComponent = false;
      if (document.body && (isComponent || window.location.pathname.includes('/components/'))) {
        document.body.classList.add('is-element-page');
      }
    })();
  </script>

  <div id="root"></div>

  
  <script src="./assets/react.production.min.js"></script>
  <script src="./assets/react-dom.production.min.js"></script>
  <script src="./assets/export-html-bootstrap.js"></script>

  <script>
    function waitForBootstrap(timeoutMs) {
      timeoutMs = timeoutMs || 10000;
      return new Promise(function (resolve, reject) {
        var startedAt = Date.now();
        function check() {
          if (window.HtmlTemplateBootstrap) {
            resolve(window.HtmlTemplateBootstrap);
            return;
          }
          if (Date.now() - startedAt >= timeoutMs) {
            reject(new Error('[Html Template] Bootstrap 初始化超时'));
            return;
          }
          setTimeout(check, 10);
        }
        check();
      });
    }

    function loadEntryScript(src) {
      return new Promise(function (resolve, reject) {
        var script = document.createElement('script');
        script.src = src;
        script.async = false;
        script.onload = function () { resolve(); };
        script.onerror = function () { reject(new Error('[Html Template] 入口脚本加载失败: ' + src)); };
        document.body.appendChild(script);
      });
    }

    async function bootstrapAndRender() {
      try {
        var bootstrap = await waitForBootstrap();
        var renderComponent = bootstrap.renderComponent;
        window.React = bootstrap.React;
        window.ReactDOM = bootstrap.ReactDOM;

        await loadEntryScript('./index.js');
        

        var Component = window.UserComponent && (window.UserComponent.Component || window.UserComponent.default || window.UserComponent);
        if (!Component) {
          throw new Error('[Html Template] 入口脚本未暴露 UserComponent');
        }

        renderComponent(Component);
      } catch (error) {
        console.error('[Html Template] 页面初始化失败:', error);
      }
    }

    bootstrapAndRender();
  </script>

</body>
