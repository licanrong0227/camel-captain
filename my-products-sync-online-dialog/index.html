-height:1;color:var(--sod-primary);background:#fff;border:1px solid var(--sod-primary);border-radius:8px;cursor:pointer;white-space:nowrap}.sod-sync-btn:hover:not(:disabled){background:var(--sod-primary-soft)}.sod-sync-btn:focus-visible{outline:2px solid #ffd9bf;outline-offset:1px}.sod-sync-btn:disabled,.sod-sync-btn.is-syncing{color:var(--sod-text-placeholder);border-color:#e4e7ed;background:#fff;cursor:not-allowed}.sod-sync-btn.is-syncing{width:159px}.sod-store-row__info{min-width:120px;line-height:1.4}.sod-store-row__name,.sod-store-row__alias{display:block;font-size:13px;color:var(--sod-text-primary);white-space:nowrap}.sod-store-row__status{flex:1 1 0;min-width:0;font-size:13px;line-height:1.45;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sod-store-row__status .is-pending{color:var(--sod-text-secondary)}.sod-store-row__status .is-running{color:var(--sod-running)}.sod-store-row__status .is-failed{color:var(--sod-failed)}.sod-store-row__time{flex-shrink:0;font-size:13px;line-height:1.45;color:var(--sod-text-secondary);white-space:nowrap}.sod-spinner{position:relative;display:inline-block;flex-shrink:0;width:12px;height:12px;margin-right:4px;color:currentColor}.sod-spinner i{position:absolute;top:5.25px;left:5.5px;width:1px;height:3.5px;background:currentColor;border-radius:1px;transform-origin:center center;animation:sod-spinner-fade .9s linear infinite}@keyframes sod-spinner-fade{0%,to{opacity:.25}50%{opacity:1}}.sod-checkbox{position:relative;display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;cursor:pointer}.sod-checkbox input{position:absolute;width:0;height:0;margin:0;opacity:0}.sod-checkbox__box{position:relative;display:inline-block;width:14px;height:14px;background:#fff;border:1px solid var(--sod-border);border-radius:2px;transition:background-color .15s,border-color .15s}.sod-checkbox:hover .sod-checkbox__box{border-color:var(--sod-blue)}.sod-checkbox__box.is-checked,.sod-checkbox__box.is-indeterminate{backg   <script>
    (function () {
      var isComponent = false;
      if (document.body && (isComponent || window.location.pathname.includes('/components/'))) {
        document.body.classList.add('is-element-page');
      }
    })();
  </script>

  <div id="root"></div>

  
  <script src="./assets/react.production.min.js"></script>
  <script src="./assets/react-dom.production.min.js"></script>
  <script src="./assets/export-html-bootstrap.js"></script>

  <script>
    function waitForBootstrap(timeoutMs) {
      timeoutMs = timeoutMs || 10000;
      return new Promise(function (resolve, reject) {
        var startedAt = Date.now();
        function check() {
          if (window.HtmlTemplateBootstrap) {
            resolve(window.HtmlTemplateBootstrap);
            return;
          }
          if (Date.now() - startedAt >= timeoutMs) {
            reject(new Error('[Html Template] Bootstrap 初始化超时'));
            return;
          }
          setTimeout(check, 10);
        }
        check();
      });
    }

    function loadEntryScript(src) {
      return new Promise(function (resolve, reject) {
        var script = document.createElement('script');
        script.src = src;
        script.async = false;
        script.onload = function () { resolve(); };
        script.onerror = function () { reject(new Error('[Html Template] 入口脚本加载失败: ' + src)); };
        document.body.appendChild(script);
      });
    }

    async function bootstrapAndRender() {
      try {
        var bootstrap = await waitForBootstrap();
        var renderComponent = bootstrap.renderComponent;
        window.React = bootstrap.React;
        window.ReactDOM = bootstrap.ReactDOM;

        await loadEntryScript('./index.js');
        

        var Component = window.UserComponent && (window.UserComponent.Component || window.UserComponent.default || window.UserComponent);
        if (!Component) {
          throw new Error('[Html Template] 入口脚本未暴露 UserComponent');
        }

        renderComponent(Component);
      } catch (error) {
        console.error('[Html Template] 页面初始化失败:', error);
      }
    }

    bootstrapAndRender();
  </script>
