t;vertical-align:top;line-height:1.6;overflow-wrap:break-word;word-break:break-word}.hcft-root .help-article-body th{background:#fff7f0;color:#9a6230;font-weight:600}.hcft-root .help-article-body img,.hcft-root .help-article-body video{max-width:100%}.hcft-hl{color:var(--erp-danger-4);background:var(--erp-danger-1);border-radius:2px}.hcft-hl.is-active{color:#fff;background:var(--erp-brand-4);border-radius:3px;box-shadow:0 0 0 2px var(--erp-brand-1);animation:hcft-hl-pop .3s ease-out}@keyframes hcft-hl-pop{0%{box-shadow:0 0 0 8px #ff7d2959}to{box-shadow:0 0 0 2px var(--erp-brand-1)}}@media (prefers-reduced-motion: reduce){.hcft-hl.is-active{animation:none}}.hcft-drawer{position:fixed;top:var(--header-height);right:0;bottom:0;width:var(--hcft-drawer-w);display:flex;flex-direction:column;background:#fff;border-left:1px solid var(--erp-neutral-4);border-radius:var(--erp-radius-card) 0 0 var(--erp-radius-card);box-shadow:var(--erp-shadow-base);transform:translate(100%);transition:transform .3s ease-out;z-index:200;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Hiragino Sans GB,Microsoft YaHei,Helvetica,Arial,sans-serif}.hcft-drawer.is-open{transform:translate(0)}@media (prefers-reduced-motion: reduce){.hcft-drawer,.hcft-root .app-body{transition:none}}.hcft-drawer *,.hcft-drawer *:before,.hcft-drawer *:after{box-sizing:border-box;margin:0;padding:0}.hcft-drawer button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit}.hcft-drawer-handle{height:20px;display:flex;align-items:center;justify-content:center;cursor:grab;touch-action:none;border-bottom:1px solid var(--erp-neutral-3);flex-shrink:0}.hcft-drawer-handle:active{cursor:grabbing}.hcft-drawer-grip{width:40px;height:4px;border-radius:2px;background:var(--erp-neutral-4)}.hcft-drawer-header{height:48px;padding:0 12px 0 20px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}.hcft-drawer-title{font-size:16px;font-weight:500;line-height:24px;color:var(--   <script>
    (function () {
      var isComponent = false;
      if (document.body && (isComponent || window.location.pathname.includes('/components/'))) {
        document.body.classList.add('is-element-page');
      }
    })();
  </script>

  <div id="root"></div>

  
  <script src="./assets/react.production.min.js"></script>
  <script src="./assets/react-dom.production.min.js"></script>
  <script src="./assets/export-html-bootstrap.js"></script>

  <script>
    function waitForBootstrap(timeoutMs) {
      timeoutMs = timeoutMs || 10000;
      return new Promise(function (resolve, reject) {
        var startedAt = Date.now();
        function check() {
          if (window.HtmlTemplateBootstrap) {
            resolve(window.HtmlTemplateBootstrap);
            return;
          }
          if (Date.now() - startedAt >= timeoutMs) {
            reject(new Error('[Html Template] Bootstrap 初始化超时'));
            return;
          }
          setTimeout(check, 10);
        }
        check();
      });
    }

    function loadEntryScript(src) {
      return new Promise(function (resolve, reject) {
        var script = document.createElement('script');
        script.src = src;
        script.async = false;
        script.onload = function () { resolve(); };
        script.onerror = function () { reject(new Error('[Html Template] 入口脚本加载失败: ' + src)); };
        document.body.appendChild(script);
      });
    }

    async function bootstrapAndRender() {
      try {
        var bootstrap = await waitForBootstrap();
        var renderComponent = bootstrap.renderComponent;
        window.React = bootstrap.React;
        window.ReactDOM = bootstrap.ReactDOM;

        await loadEntryScript('./index.js');
        

        var Component = window.UserComponent && (window.UserComponent.Component || window.UserComponent.default || window.UserComponent);
        if (!Component) {
          throw new Error('[Html Template] 入口脚本未暴露 UserComponent');
        }

        renderComponent(Component);
      } catch (error) {
        console.error('[Html Template] 页面初始化失败:', error);
      }
    }

    bootstrapAndRender();
  </script>
